<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#0a0a0a"/>
  <text x="40" y="56" fill="#ffffff" font-size="30" font-weight="700">Nutrition</text>
  <rect x="760" y="30" width="100" height="38" rx="11" fill="#264d8d"/>
  <text x="810" y="54" fill="#ffffff" font-size="13" text-anchor="middle">Add Entry</text>

  <!-- Today goal card -->
  <rect x="40" y="92" width="820" height="246" rx="16" fill="#121212" stroke="rgba(255,255,255,0.06)"/>
  <text x="64" y="124" fill="#ffffff" font-size="16" font-weight="600">Today</text>
  <rect x="772" y="106" width="76" height="32" rx="10" fill="none" stroke="rgba(255,255,255,0.12)"/>
  <text x="810" y="127" fill="#e5e7eb" font-size="12" text-anchor="middle">Edit goal</text>

  <text x="64" y="178" fill="#ffffff" font-size="40" font-weight="700">1,180</text>
  <text x="176" y="178" fill="#6b7280" font-size="15">kcal remaining</text>
  <text x="64" y="200" fill="#6b7280" font-size="12">1,320 of 2,500 kcal consumed</text>
  <rect x="64" y="210" width="784" height="10" rx="5" fill="rgba(255,255,255,0.1)"/>
  <rect x="64" y="210" width="414" height="10" rx="5" fill="#264d8d"/>

  <!-- macro bars -->
  <g>
    <text x="64" y="262" fill="#9ca3af" font-size="13">Protein</text>
    <text x="300" y="262" fill="#ffffff" font-size="13" text-anchor="end">62g left</text>
    <rect x="64" y="272" width="236" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
    <rect x="64" y="272" width="150" height="8" rx="4" fill="#264d8d"/>
    <text x="64" y="300" fill="#6b7280" font-size="11">118 / 180 g</text>
  </g>
  <g>
    <text x="332" y="262" fill="#9ca3af" font-size="13">Carbs</text>
    <text x="568" y="262" fill="#ffffff" font-size="13" text-anchor="end">90g left</text>
    <rect x="332" y="272" width="236" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
    <rect x="332" y="272" width="120" height="8" rx="4" fill="#264d8d"/>
    <text x="332" y="300" fill="#6b7280" font-size="11">160 / 250 g</text>
  </g>
  <g>
    <text x="600" y="262" fill="#9ca3af" font-size="13">Fat</text>
    <text x="836" y="262" fill="#ffffff" font-size="13" text-anchor="end">22g left</text>
    <rect x="600" y="272" width="236" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
    <rect x="600" y="272" width="150" height="8" rx="4" fill="#264d8d"/>
    <text x="600" y="300" fill="#6b7280" font-size="11">48 / 70 g</text>
  </g>

  <!-- log table preview -->
  <rect x="40" y="352" width="820" height="98" rx="16" fill="#121212" stroke="rgba(255,255,255,0.06)"/>
  <g fill="#6b7280" font-size="11" letter-spacing="0.6">
    <text x="64" y="380">DATE</text>
    <text x="220" y="380">CALORIES</text>
    <text x="360" y="380">PROTEIN</text>
    <text x="500" y="380">CARBS</text>
    <text x="640" y="380">FAT</text>
  </g>
  <line x1="64" y1="390" x2="836" y2="390" stroke="rgba(255,255,255,0.1)"/>
  <g fill="#e5e7eb" font-size="13">
    <text x="64" y="416">11/06/2026</text>
    <text x="220" y="416">620 kcal</text>
    <text x="360" y="416">55 g</text>
    <text x="500" y="416">70 g</text>
    <text x="640" y="416">22 g</text>
  </g>
  <line x1="64" y1="426" x2="836" y2="426" stroke="rgba(255,255,255,0.05)"/>
</svg>
